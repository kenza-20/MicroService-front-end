<!-- src/app/views/admin/notifications/notifications.component.html -->

<div class="p-6 bg-gray-100 min-h-screen">
  <div class="mb-4 flex justify-between items-center">
    <h2 class="text-2xl font-bold">Gestion De Notifications</h2>
    <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
            (click)="markAllAsRead()">Marquer tout comme lu</button>
    <br>
    <button routerLink="/admin/notifications/send"
            class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
      ➕ Nouvelle Notification
    </button>
    <br><br><br><br><br><br>
  </div>

  <div class="mb-4">
    <select class="border px-2 py-1" [(ngModel)]="selectedType">
      <option value="">Toutes</option>
      <option value="congé">Congé</option>
      <option value="paie">Paie</option>
      <option value="recrutement">Recrutement</option>
    </select>
  </div>

  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let notif of filteredNotifications()" class="bg-white shadow rounded-lg p-4 relative">
      <span class="text-sm text-gray-400 absolute top-2 right-4">{{ notif.createdAt }}</span>
      <h3 class="text-lg font-semibold mb-2">{{ notif.subject }}</h3>
      <p class="text-gray-700">{{ notif.content }}</p>  <!-- Display the message content here -->
      <div class="mt-4 flex justify-end space-x-2">
        <button class="text-green-600 hover:underline text-sm" *ngIf="!notif.read" (click)="markAsRead(notif)">
          Mark as Read
        </button>
        <button class="text-red-600 hover:underline text-sm" (click)="deleteNotification(notif.id)">
          Delete
        </button>
      </div>
      <div *ngIf="!notif.read" class="absolute top-2 left-2 w-3 h-3 bg-red-500 rounded-full"></div>
    </div>
  </div>
</div>
