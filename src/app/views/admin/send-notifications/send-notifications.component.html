<div class="p-6 bg-gray-100 min-h-screen">
  <h2 class="text-2xl font-bold mb-4">Send a Notification</h2>

  <form (ngSubmit)="sendNotification()" class="space-y-4">
    <div>
      <label class="font-semibold">Recipient:</label>
      <input type="text" [(ngModel)]="recipient" name="recipient" required class="border px-2 py-1 rounded w-full"/>
    </div>

    <div>
      <label class="font-semibold">Phone Number (if SMS):</label>
      <input type="text" [(ngModel)]="phoneNumber" name="phoneNumber" class="border px-2 py-1 rounded w-full"/>
    </div>

    <div>
      <label class="font-semibold">Message:</label>
      <textarea [(ngModel)]="message" name="message" required class="border px-2 py-1 rounded w-full"></textarea>
    </div>

    <div>
      <label class="font-semibold">Service Name:</label>
      <input type="text" [(ngModel)]="serviceName" name="serviceName" class="border px-2 py-1 rounded w-full"/>
    </div>

    <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">Send</button>
  </form>

  <p *ngIf="statusMessage" class="mt-4 text-gray-700">{{ statusMessage }}</p>
</div>
